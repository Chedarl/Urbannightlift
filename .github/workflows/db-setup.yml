name: DB setup

# One-click database setup for the real Supabase project.
# Runs from GitHub's network (which can reach Supabase Postgres) so no local
# dev environment is needed. Applies the Prisma schema and the idempotent seed
# (zones, merchants, operating settings, and the staff User rows the app matches
# on login). Safe to re-run — the seed upserts and skips anything that exists.
#
# Before running, add these as repository secrets
# (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL, DIRECT_URL,
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SECRET_KEY,
#   SEED_ADMIN_PASSWORD, SEED_RIDER_PASSWORD

on:
  workflow_dispatch:
    inputs:
      purge_imported_merchants:
        description: "Remove the merchants imported from OpenStreetMap (they were mostly defunct). Keeps any attached to an order."
        type: boolean
        default: false
      apply_launch_config:
        description: "Set the live services to Food + Pharmacy + Small parcel and switch voice ordering on. Leaves operating mode and test mode alone."
        type: boolean
        default: false

jobs:
  db-setup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      SEED_RIDER_PASSWORD: ${{ secrets.SEED_RIDER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply schema
        run: npx prisma migrate deploy
      - name: Seed data
        run: npx prisma db seed
      # One-off cleanup: the OpenStreetMap import turned out to be mostly
      # businesses that no longer trade. Safe to re-run — it only touches rows
      # with source="osm" and never deletes one attached to an order.
      - name: Purge merchants imported from OpenStreetMap
        if: ${{ inputs.purge_imported_merchants }}
        run: npm run purge:imported-merchants
      # The seed keeps enabledServices out of its update block so a reseed can
      # never undo what the owner switched on in admin Settings. This is the
      # explicit way to move the live configuration. Idempotent.
      - name: Apply launch configuration (3 services + voice ordering)
        if: ${{ inputs.apply_launch_config }}
        run: npm run apply:launch-config
