
name: Kimi Code Generator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Instruction for Kimi (what to generate or edit)'
        required: true

jobs:
  run-kimi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Call Kimi API
        id: call_kimi
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          set -euo pipefail
          echo "Sending prompt to Kimi..."
          REQUEST_PAYLOAD=$(jq -n --arg model "kimi-k2.7-code-highspeed" --arg prompt "$PROMPT" \
            '{model:$model, messages:[{role:"system", content:"You are Kimi, an AI assistant for code generation and editing. Produce either a unified diff patch when making changes or the full file contents if creating new files."},{role:"user", content:$prompt}], stream:false}')
          RESPONSE=$(curl -s -X POST "https://api.moonshot.ai/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $MOONSHOT_API_KEY" \
            -d "$REQUEST_PAYLOAD")
          echo "$RESPONSE" > kimi_response.json
          # Extract the assistant content (OpenAI-compatible response)
          jq -r '.choices[0].message.content // .choices[0].text // ""' kimi_response.json | sed 's/\r//g' > kimi_output.txt
          echo "Kimi output saved to kimi_output.txt"
          head -c 1000 kimi_output.txt || true

      - name: Commit generated changes to a branch
        id: commit_changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="kimi-generated-$(date +%s)"
          git checkout -b "$BRANCH"

          # If output looks like a unified diff, try to apply it; otherwise create a file for review
          if grep -q '^diff --git' kimi_output.txt; then
            echo "Detected unified diff — attempting to apply as patch."
            set +e
            git apply --index kimi_output.txt
            APPLY_EXIT=$?
            set -e
            if [ $APPLY_EXIT -ne 0 ]; then
              echo "git apply failed; saving raw output to GENERATED_BY_KIMI.md"
              cat kimi_output.txt > GENERATED_BY_KIMI.md
              git add GENERATED_BY_KIMI.md
            else
              echo "Patch applied successfully."
            fi
          else
            echo "No patch detected — creating GENERATED_BY_KIMI.md with the model output."
            {
              printf "# Generated by Kimi\n\n"
              printf "Original prompt:\n\n%s\n\n---\n\n" "$PROMPT"
              cat kimi_output.txt
            } > GENERATED_BY_KIMI.md
            git add GENERATED_BY_KIMI.md
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit"
            # still export branch so PR step knows the branch name
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "Kimi: apply generated changes"
          git push --set-upstream origin "$BRANCH"

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: actions/github-script@v6
        env:
          BRANCH: ${{ steps.commit_changes.outputs.branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = process.env.BRANCH;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = (await github.rest.repos.get({owner, repo})).data.default_branch;
            const title = `Kimi: generated changes (${branch})`;
            const body = `This pull request was created by a GitHub Action that called the Kimi API. Please review the changes before merging.`;
            // Create the PR; if it exists already, ignore the error
            await github.rest.pulls.create({owner, repo, title, head: branch, base: defaultBranch, body});

      - name: Done
        run: echo "Workflow finished. If a PR was created, review it in the repository."
