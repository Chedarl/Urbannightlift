<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Urban Night Lift</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #08060e;
        color: #f6f4fb;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 22rem;
        border: 1px solid #271a44;
        background: #110b1c;
        border-radius: 1.5rem;
        padding: 2rem 1.5rem;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { font-size: 0.875rem; line-height: 1.6; color: #b4a9c6; margin: 0 0 1.25rem; }
      button {
        width: 100%;
        border: 0;
        border-radius: 0.75rem;
        background: #d4af37;
        color: #08060e;
        font-weight: 700;
        font-size: 0.9375rem;
        padding: 0.875rem;
      }
      .dot { font-size: 2rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">🌙</div>
      <h1>You're offline</h1>
      <p>
        Urban Night Lift needs a connection to show live order status and tracking.
        Check your data or Wi-Fi, then try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
